name: CI Pipeline

on:
  push:
    branches: [ main, verson-update-code ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Test, Build & Security Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Active LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Production Vite Build
        run: npm run build

      - name: Execute Full Test Suite
        run: npm test
