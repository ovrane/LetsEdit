name: CI Pipeline

on:
  push:
    branches: [ main, verson-update-code ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Test, Build & Security Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Architecture Rule Check (Max 1,000 lines per JS file)
        run: |
          echo "Checking JavaScript files for 1,000-line ceiling rule..."
          FAIL=0
          while IFS= read -r file; do
            LINES=$(wc -l < "$file")
            if [ "$LINES" -gt 1000 ]; then
              echo "❌ Error: $file exceeds 1,000 lines ($LINES lines)."
              FAIL=1
            fi
          done < <(find src -type f \( -name "*.js" -o -name "*.jsx" \))
          if [ "$FAIL" -eq 1 ]; then
            echo "Line limit check failed. Modularize files exceeding 1,000 lines."
            exit 1
          fi
          echo "✅ All JavaScript files are strictly under 1,000 lines."

      - name: Execute Full Test Suite (326 Tests)
        run: npm test

      - name: Verify Production Vite Build
        run: npm run build
