<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Studio & Editor | Professional Online PDF Suite</title>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9.5 8.5h-2v2h2c.55 0 1-.45 1-1s-.45-1-1-1zm5 2h-1.5v-1h1.5c.28 0 .5-.22.5-.5s-.22-.5-.5-.5H13v3h1.5c.28 0 .5-.22.5-.5s-.22-.5-.5-.5z'/></svg>">
</head>
<body class="sidebar-open">

  <!-- Main Top Navbar -->
  <header class="app-navbar">
    <div class="navbar-brand">
      <button id="toggle-sidebar-btn" class="icon-btn" title="Toggle Pages Drawer">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div class="brand-badge">PDF</div>
      <h1 class="brand-title">Studio</h1>
      <span class="file-name-tag" id="current-filename">Sample_Document.pdf</span>
      <input type="file" id="upload-pdf-input" accept="application/pdf" style="display:none;" />
      <button class="btn btn-sm btn-outline" id="btn-open-pdf">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
        <span>Open PDF</span>
      </button>
    </div>

    <!-- Center Document Controls (Undo, Redo, Zoom) -->
    <div class="navbar-center">
      <div class="toolbar-group">
        <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 015 5v2M3 10l6-6M3 10l6 6"></path></svg>
        </button>
        <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10H11a5 5 0 00-5 5v2m15-7l-6-6m6 6l-6 6"></path></svg>
        </button>
      </div>

      <div class="toolbar-group">
        <button class="icon-btn" id="btn-zoom-out" title="Zoom Out">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 12H4"></path></svg>
        </button>
        <span id="zoom-level-text" style="font-size:12px; font-weight:600; padding:0 6px; min-width:44px; text-align:center;">120%</span>
        <button class="icon-btn" id="btn-zoom-in" title="Zoom In">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
        </button>
      </div>
    </div>

    <!-- Right Actions: Save / Download, Account -->
    <div class="navbar-right">
      <button class="btn btn-primary btn-sm" id="btn-save-pdf">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        <span>Apply & Export PDF</span>
      </button>

      <div id="user-profile-widget">
        <button class="btn btn-outline btn-sm" id="btn-open-auth">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          <span id="user-display-name">Log in</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Secondary Tools Bar (The 9 Core Tools) -->
  <nav class="app-toolbar">
    <div class="toolbar-group">
      <button class="tool-btn active" data-tool="select" title="Selection & Move Tool">
        <span>Cursor</span>
      </button>

      <button class="tool-btn" data-tool="text" title="Add text or click existing text to edit">
        <span>Text</span>
      </button>

      <button class="tool-btn" data-tool="draw" title="Freehand Pen">
        <span>Draw</span>
      </button>

      <button class="tool-btn" data-tool="highlight" title="Highlighter Pen">
        <span>Highlight</span>
      </button>

      <button class="tool-btn" data-tool="whiteout" title="Redaction / Whiteout box">
        <span>Whiteout</span>
      </button>

      <button class="tool-btn" data-tool="eraser" title="Eraser (Erase pen, highlighter, and drawings)">
        <span>Eraser</span>
      </button>

      <button class="tool-btn" data-tool="shape" title="Shapes (Rectangle, Circle, Line, Arrow)">
        <span>Shape</span>
      </button>

      <button class="tool-btn" data-tool="sign" title="Electronic Signature">
        <span>Sign</span>
      </button>

      <button class="tool-btn" data-tool="image" title="Insert Images & Stamps">
        <span>Image</span>
      </button>

      <button class="tool-btn" data-tool="form" title="Form Fields (Input, Checkbox, Radio)">
        <span>Form</span>
      </button>

      <button class="tool-btn" data-tool="replace" title="Find and Replace text">
        <span>Find & Replace</span>
      </button>

      <button class="tool-btn" id="btn-open-watermark" title="Add Document Watermark">
        <span>Watermark</span>
      </button>

      <button class="tool-btn" id="btn-open-pagenumbers" title="Add Page Numbers">
        <span>Page Numbers</span>
      </button>

      <button class="tool-btn" id="btn-open-security" title="Protect & Encrypt PDF">
        <span>Security</span>
      </button>
    </div>
  </nav>

  <!-- Dynamic Property Inspector Bar (Reflects Active Tool) -->
  <div class="properties-bar" id="properties-bar">
    <div class="prop-item" id="prop-color-wrap">
      <label>Color:</label>
      <input type="color" id="prop-color" class="color-input-badge" value="#000000" />
    </div>

    <div class="prop-item" id="prop-font-size-wrap">
      <label>Size:</label>
      <select id="prop-font-size" class="select-sm">
        <option value="12">12 px</option>
        <option value="14">14 px</option>
        <option value="16" selected>16 px</option>
        <option value="18">18 px</option>
        <option value="20">20 px</option>
        <option value="24">24 px</option>
        <option value="32">32 px</option>
      </select>
    </div>

    <div class="prop-item" id="prop-font-family-wrap">
      <label>Font:</label>
      <select id="prop-font-family" class="select-sm">
        <option value="Helvetica" selected>Helvetica / Arial</option>
        <option value="TimesRoman">Times New Roman</option>
        <option value="Courier">Courier Monospace</option>
      </select>
    </div>

    <div class="prop-item" id="prop-stroke-width-wrap">
      <label>Stroke:</label>
      <select id="prop-stroke-width" class="select-sm">
        <option value="1">1 px</option>
        <option value="2" selected>2 px</option>
        <option value="4">4 px</option>
        <option value="8">8 px</option>
      </select>
    </div>

    <div class="prop-item" id="prop-shape-type-wrap" style="display:none;">
      <label>Shape:</label>
      <select id="prop-shape-type" class="select-sm">
        <option value="rectangle" selected>Rectangle</option>
        <option value="ellipse">Circle / Ellipse</option>
        <option value="line">Line</option>
        <option value="arrow">Arrow</option>
      </select>
    </div>

    <div class="prop-item" id="prop-form-type-wrap" style="display:none;">
      <button class="btn btn-outline btn-sm" id="btn-add-form-text">+ Text Box</button>
      <button class="btn btn-outline btn-sm" id="btn-add-form-checkbox">+ Checkbox</button>
      <button class="btn btn-outline btn-sm" id="btn-add-form-radio">+ Radio Button</button>
    </div>

    <!-- Find and replace inputs -->
    <div class="prop-item" id="prop-replace-wrap" style="display:none;">
      <input type="text" id="find-query-input" class="input-sm" placeholder="Find text..." />
      <input type="text" id="replace-query-input" class="input-sm" placeholder="Replace with..." />
      <button class="btn btn-sm btn-outline" id="btn-do-search">Search</button>
      <button class="btn btn-sm btn-primary" id="btn-do-replace">Replace All</button>
      <span id="search-count-badge" style="font-size:12px; color:var(--text-muted);">0 found</span>
    </div>
  </div>

  <!-- Workspace: Sidebar & Document Canvas Viewport -->
  <main class="app-main">
    <!-- Left Pages Sidebar -->
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- Main Scrollable Canvas Viewport -->
    <section class="document-viewport" id="document-viewport"></section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
