<body class="show-landing sidebar-open tool-sidebar-open">

  <!-- Main Top Navbar (Adobe Acrobat Style Executive Command Bar) -->

          <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>

      <button id="toggle-sidebar-btn" class="icon-btn" title="Toggle Pages Drawer (Shift+P)">

          <path d="M4 6h16M4 12h16M4 18h16"></path>

            <rect x="2" y="13" width="9" height="9" rx="2.8" fill="#2F74EE" />
            <rect x="13" y="13" width="9" height="9" rx="2.8" fill="#F0A500" />

        <span class="lets-logo-text">Lets<span class="lets-logo-accent">Edit</span></span>
      </div>
      <div class="file-title-pill" id="current-filename-pill" title="Click to rename document">
        <span class="file-name-tag" id="current-filename">No document selected</span>
        <svg class="rename-icon" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"

          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </div>
      <input type="file" id="upload-pdf-input" accept="application/pdf" style="display:none;" />

        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

        </svg>

    <!-- Center Document Controls (Undo, Redo, Page Nav, Zoom & Fit) -->

      <div class="navbar-cmd-group">
        <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)">

            <path d="M3 10h10a5 5 0 0 1 5 5v2M3 10l6-6M3 10l6 6"></path>

        </button>
        <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 10H11a5 5 0 0 0-5 5v2m15-7l-6-6m6 6l-6 6"></path>
          </svg>
        </button>
      </div>

      <div class="navbar-divider"></div>

      <div class="navbar-cmd-group page-nav-group">
        <button class="icon-btn icon-btn-xs" id="btn-page-prev" title="Previous Page (PgUp)">

            <polyline points="15 18 9 12 15 6"></polyline>

        <button class="icon-btn icon-btn-xs" id="btn-page-next" title="Next Page (PgDn)">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <div class="navbar-divider"></div>

      <div class="navbar-cmd-group zoom-group">
        <button class="icon-btn icon-btn-xs" id="btn-zoom-out" title="Zoom Out (Ctrl+-)">

            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <span id="zoom-level-text" class="zoom-text">100%</span>
        <button class="icon-btn icon-btn-xs" id="btn-zoom-in" title="Zoom In (Ctrl++)">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="icon-btn icon-btn-xs" id="btn-fit-width" title="Fit to Width">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 12h16M4 12l4-4M4 12l4 4M20 12l-4-4M20 12l4 4"></path>
          </svg>
        </button>
        <button class="icon-btn icon-btn-xs" id="btn-fit-page" title="Fit Entire Page">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="5" y="4" width="14" height="16" rx="2"></rect>
            <path d="M9 9h6M9 13h6"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Right Actions: Autosave, Theme Toggle, All Tools, Export, Account -->
    <div class="navbar-right">
      <div class="autosave-badge" title="Changes auto-saved in browser session">
        <span class="autosave-dot"></span>
        <span>Saved</span>
      </div>

      <button class="icon-btn" id="btn-theme-toggle" title="Toggle Theme (Dark / Light)">
        <svg class="theme-icon-sun" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"

          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>

      </button>

      <button class="btn btn-sm btn-outline" id="btn-open-all-tools" title="Open 43+ PDF Tools Directory (/)">

          <circle cx="12" cy="5" r="2"></circle>
          <circle cx="19" cy="5" r="2"></circle>
          <circle cx="5" cy="12" r="2"></circle>
          <circle cx="12" cy="12" r="2"></circle>
          <circle cx="19" cy="12" r="2"></circle>
          <circle cx="5" cy="19" r="2"></circle>
          <circle cx="12" cy="19" r="2"></circle>
          <circle cx="19" cy="19" r="2"></circle>
        </svg>
        <span>All Tools</span>
      </button>

      <button class="icon-btn" id="btn-toggle-tool-sidebar" title="Toggle Tool Options Sidebar">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>

      <button class="btn btn-primary btn-sm btn-export-pdf" id="btn-save-pdf" title="Apply changes & export PDF">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path>
        </svg>
        <span>Apply changes</span>
      </button>

      <div id="user-profile-widget">
        <button class="btn btn-outline btn-sm" id="btn-open-auth">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span id="user-display-name">Log in</span>
        </button>

    </div>

      <button class="tool-btn" data-tool="text" title="Text Tool (T)">

          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
        </svg>
        <span>Draw</span>
      </button>

      <button class="tool-btn" data-tool="highlight" title="Highlighter (H)">

          <path d="M3 22h18"></path>

      </button>

      <button class="tool-btn" data-tool="eraser" title="Eraser (E)">

          <path d="M18 13l-7-7L3 14l7 7 8-8z"></path>
          <line x1="14" y1="22" x2="22" y2="22"></line>
        </svg>
        <span>Eraser</span>
      </button>

        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="12 8 8 16 16 16"></polygon>
        </svg>
        <span>Shapes</span>

        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>Stamps</span>
      </button>

      <button class="tool-btn" data-tool="note" title="Sticky Note & Comments (C)">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Note</span>
      </button>
    </div>

    <!-- Group 3: Security, Redaction & Forms -->
    <div class="toolbar-group">
      <button class="tool-btn" data-tool="whiteout" title="Permanent Redaction & Vector Whiteout (R)">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

    <!-- Group 2: Canva Dropdown Category Menus -->

      <!-- Pages Dropdown -->
      <div class="canva-dropdown">

            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>Pages</span>
          <svg class="chevron-icon" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
        </button>
        <div class="dropdown-menu">
          <button class="dropdown-item" id="btn-open-split">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M16 3h5v5M8 3H3v5M12 22V2"></path>
            </svg>
            <div>
              <div class="dropdown-title">Split Pages</div>
              <div class="dropdown-desc">Extract custom page ranges</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-split-half">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z">

              <div class="dropdown-title">Split in Half</div>
              <div class="dropdown-desc">Bisect two-page book scans</div>

          </button>

            <div>
              <div class="dropdown-title">Alternate & Mix</div>

            <div>

          </button>

            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">

        <div class="dropdown-menu">
          <button class="dropdown-item" id="btn-open-compress">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M4 14h6m-6-4h6m4 8h6m-6-4h6M4 6h16M4 18h4"></path>
            </svg>
            <div>
              <div class="dropdown-title">Compress PDF</div>
              <div class="dropdown-desc">Reduce document file size</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-watermark">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
            </svg>
            <div>
              <div class="dropdown-title">Watermark</div>
              <div class="dropdown-desc">Diagonal text or stamp overlay</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-pagenumbers">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <line x1="4" y1="9" x2="20" y2="9"></line>
              <line x1="4" y1="15" x2="20" y2="15"></line>
              <line x1="10" y1="3" x2="8" y2="21"></line>
              <line x1="16" y1="3" x2="14" y2="21"></line>
            </svg>
            <div>
              <div class="dropdown-title">Page Numbers</div>
              <div class="dropdown-desc">Header & Footer numbering</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-bates">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <div>
              <div class="dropdown-title">Bates Numbering</div>
              <div class="dropdown-desc">Legal indexing sequences</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-security">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <div>
              <div class="dropdown-title">Protect & Encrypt</div>
              <div class="dropdown-desc">AES password security</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-metadata">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <div>
              <div class="dropdown-title">Metadata & Properties</div>
              <div class="dropdown-desc">Title, Author, Keywords</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-grayscale">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"></path>
            </svg>
            <div>
              <div class="dropdown-title">Grayscale PDF</div>
              <div class="dropdown-desc">Desaturate colors & save ink</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-sanitize">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <div>
              <div class="dropdown-title">Sanitize Document</div>
              <div class="dropdown-desc">Purge hidden metadata & scripts</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-flatten">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            <div>
              <div class="dropdown-title">Flatten Forms</div>
              <div class="dropdown-desc">Lock interactive fields to vector art</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-ocr">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M4 7V4h16v3M9 20h6M12 4v16"></path>
            </svg>
            <div>
              <div class="dropdown-title">OCR PDF</div>
              <div class="dropdown-desc">Make scanned text searchable</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Convert Dropdown -->
      <div class="canva-dropdown">
        <button class="tool-btn dropdown-trigger" id="dropdown-convert-btn" title="Convert to and from PDF">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span>Convert</span>
          <svg class="chevron-icon" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
        </button>
        <div class="dropdown-menu">
          <button class="dropdown-item" id="btn-open-to-image">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <div>
              <div class="dropdown-title">PDF to JPG / PNG</div>
              <div class="dropdown-desc">High-res 72, 150, or 300 DPI</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-open-extract-images">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <div>
              <div class="dropdown-title">Extract Images</div>
              <div class="dropdown-desc">Extract embedded JPEG/PNGs to ZIP</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-quick-images-to-pdf">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path>
            </svg>
            <div>
              <div class="dropdown-title">Images to PDF</div>
              <div class="dropdown-desc">Combine photos into A4 PDF</div>
            </div>
          </button>
          <button class="dropdown-item" id="btn-quick-extract-text">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <line x1="21" y1="10" x2="3" y2="10"></line>
              <line x1="21" y1="6" x2="3" y2="6"></line>
              <line x1="21" y1="14" x2="3" y2="14"></line>
              <line x1="17" y1="18" x2="3" y2="18"></line>
            </svg>
            <div>
              <div class="dropdown-title">Extract Plain Text</div>
              <div class="dropdown-desc">Save text to .txt document</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Find & Replace Trigger -->
      <button class="tool-btn" data-tool="replace" id="btn-toggle-find"
        title="Find & Replace text in document (Ctrl+F)">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Find</span>
      </button>
    </div>
  </nav>

  <!-- Dynamic Property Inspector Bar (Reflects Active Tool) -->
  <div class="properties-bar" id="properties-bar">
    <div class="prop-item" id="prop-color-wrap">
      <label>Color:</label>
      <input type="color" id="prop-color" class="color-input-badge" value="#000000" />
    </div>

    <div class="prop-item" id="prop-font-size-wrap">
      <label>Size:</label>
      <select id="prop-font-size" class="select-sm">
        <option value="12">12 px</option>
        <option value="14">14 px</option>
        <option value="16" selected>16 px</option>
        <option value="18">18 px</option>
        <option value="20">20 px</option>
        <option value="24">24 px</option>
        <option value="32">32 px</option>
      </select>
    </div>

    <div class="prop-item" id="prop-font-family-wrap">
      <label>Font:</label>
      <select id="prop-font-family" class="select-sm">
        <option value="Helvetica" selected>Helvetica / Arial</option>
      </select>
    </div>

    <!-- Adobe Acrobat & Smallpdf Text Formatting Controls -->
    <div class="prop-item" id="prop-format-wrap" style="display:none; align-items:center; gap:3px;">
      <button class="btn-icon-toggle" id="prop-btn-bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="btn-icon-toggle" id="prop-btn-italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="btn-icon-toggle" id="prop-btn-underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button class="btn-icon-toggle" id="prop-btn-strike" title="Strikethrough"><s>S</s></button>
      <div class="prop-divider" style="width:1px; height:16px; background:var(--border); margin:0 4px;"></div>
      <button class="btn-icon-toggle active" id="prop-btn-align-left" title="Align Left">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="17" y1="10" x2="3" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="17" y1="18" x2="3" y2="18"></line>
        </svg>
      </button>
      <button class="btn-icon-toggle" id="prop-btn-align-center" title="Align Center">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="18" y1="10" x2="6" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="18" y1="18" x2="6" y2="18"></line>
        </svg>
      </button>
      <button class="btn-icon-toggle" id="prop-btn-align-right" title="Align Right">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="21" y1="10" x2="7" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="21" y1="18" x2="7" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="prop-item" id="prop-highlight-wrap" style="display:none; align-items:center; gap:6px;">
      <label>Highlight:</label>
      <input type="color" id="prop-highlight-color" class="color-input-badge" value="#fef08a"
        title="Text Background Highlight" />
    </div>

    <div class="prop-item" id="prop-stroke-width-wrap">
      <label>Stroke:</label>
      <select id="prop-stroke-width" class="select-sm">
        <option value="1">1 px</option>
        <option value="2" selected>2 px</option>
        <option value="4">4 px</option>
        <option value="8">8 px</option>
      </select>
    </div>

    <div class="prop-item" id="prop-shape-type-wrap" style="display:none;">
      <label>Shape:</label>
      <select id="prop-shape-type" class="select-sm">
        <option value="rectangle" selected>Rectangle</option>
        <option value="ellipse">Circle / Ellipse</option>
        <option value="line">Line</option>
        <option value="arrow">Arrow</option>
      </select>
    </div>

    <div class="prop-item" id="prop-form-type-wrap" style="display:none;">
      <button class="btn btn-outline btn-sm" id="btn-add-form-text">+ Text Box</button>
      <button class="btn btn-outline btn-sm" id="btn-add-form-checkbox">+ Checkbox</button>
      <button class="btn btn-outline btn-sm" id="btn-add-form-radio">+ Radio Button</button>
    </div>

    <!-- Find and replace inputs -->
    <div class="prop-item" id="prop-replace-wrap" style="display:none; align-items:center; gap:8px;">
      <input type="text" id="find-query-input" class="input-sm" placeholder="Find text..." />
      <input type="text" id="replace-query-input" class="input-sm" placeholder="Replace with..." />
      <button class="btn btn-sm btn-outline" id="btn-do-search">Search</button>
      <div style="display:flex; align-items:center; gap:3px;">
        <button class="btn btn-sm btn-outline" id="btn-prev-match" title="Previous Match"
          style="padding:4px 8px;">◀</button>
        <span id="search-count-badge"
          style="font-size:12px; color:var(--text-muted); min-width:44px; text-align:center;">0/0</span>
        <button class="btn btn-sm btn-outline" id="btn-next-match" title="Next Match"
          style="padding:4px 8px;">▶</button>
      </div>
      <button class="btn btn-sm btn-outline" id="btn-do-replace-one">Replace</button>
      <button class="btn btn-sm btn-primary" id="btn-do-replace">Replace All</button>
      <label
        style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-muted); cursor:pointer;">
        <input type="checkbox" id="chk-search-case" /> Case
      </label>
      <label
        style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-muted); cursor:pointer;">
        <input type="checkbox" id="chk-search-regex" /> Regex
      </label>
    </div>
  </div>

  <!-- Workspace: Sidebar & Document Canvas Viewport -->
  <main class="app-main">
    <!-- Left Pages Sidebar -->
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- Main Scrollable Canvas Viewport -->
    <section class="document-viewport" id="document-viewport"></section>

    <!-- Right Tool Options Sidebar -->
    <aside class="tool-options-sidebar" id="tool-options-sidebar"></aside>

    <!-- Floating Action Bar for Studio Editor (Sejda-style persistent 'Apply changes') -->
    <div class="editor-floating-bottom-bar" id="editor-floating-apply">
      <button class="btn btn-primary btn-apply-changes" id="btn-floating-apply" title="Apply changes and export PDF">
        <span>Apply changes</span>
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
